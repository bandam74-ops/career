<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박동영 | 이력</title>
<meta name="description" content="태권도 시범 연출가 · 교육자 박동영의 경력, 연출, 연구, 수상 이력">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#fbfbfa; --surface:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --faint:#9a9aa0;
  --line:#e7e6e3; --accent:#1f4fd1; --accent-soft:#eaf0ff; --chip:#f2f1ee;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111214; --surface:#18191c; --text:#ececee; --muted:#a2a2a8; --faint:#75757c;
    --line:#2a2b2f; --accent:#7aa2ff; --accent-soft:#1c2540; --chip:#222327; }
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{flex:none;font-weight:700;text-decoration:none;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-size:14px;color:var(--muted);padding:6px 12px;border-radius:999px;transition:.15s}
.tabs a:hover{color:var(--text);background:var(--chip)}
.tabs a.active{color:var(--accent);background:var(--accent-soft);font-weight:600}

/* page header */
.page-head{padding:56px 0 32px}
.page-head h1{font-size:34px;line-height:1.2;margin:0;letter-spacing:-.02em}
.page-head p{margin:12px 0 0;color:var(--muted);font-size:16px}
.page-head .updated{font-size:13px;color:var(--faint);margin-top:10px}

/* home hero */
.hero{display:flex;gap:28px;align-items:center}
.hero img{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:none;border:1px solid var(--line)}
.hero h1 small{font-size:16px;font-weight:500;color:var(--faint);margin-left:8px;letter-spacing:0}
.hero .title{color:var(--muted);margin:6px 0 0;font-size:15px}
.intro{margin:28px 0 0;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:32px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}

/* category cards on home */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;transition:.15s}
.cat:hover{border-color:var(--accent);transform:translateY(-1px)}
.cat .n{font-size:13px;color:var(--accent);font-weight:600}
.cat h3{margin:4px 0 4px;font-size:18px}
.cat p{margin:0;font-size:14px;color:var(--muted)}
.cat .go{display:block;margin-top:12px;font-size:14px;color:var(--accent)}

/* sections */
section{padding:40px 0;border-top:1px solid var(--line)}
section > h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
section > p.lead{margin:0 0 24px;color:var(--muted);font-size:15px}
h2 .count{font-size:14px;color:var(--faint);font-weight:500;margin-left:6px}

.entry{position:relative;padding:0 0 28px 22px;border-left:2px solid var(--line);margin-left:5px}
.entry:last-child{padding-bottom:0}
.entry::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--faint)}
.entry.now::before{border-color:var(--accent);background:var(--accent)}
.period{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.entry.now .period{color:var(--accent);font-weight:600}
.entry h3{font-size:19px;margin:2px 0 0;letter-spacing:-.01em}
.role{font-size:15px;color:var(--muted);margin:2px 0 0}
.desc{margin:6px 0 0;font-size:15px}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .d{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.rows .t{font-weight:500}
.rows .s{display:block;font-size:14px;color:var(--muted);font-weight:400}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:6px;vertical-align:1px}
.badge.gold{background:var(--accent-soft);color:var(--accent)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card .t{font-weight:600}
.card .s{font-size:14px;color:var(--muted)}
.card .d{font-size:12px;color:var(--faint);margin-top:4px}
.amt{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:14px}

.contact ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.contact a{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px;border-radius:999px;font-size:15px}
.contact a:hover{border-color:var(--accent);color:var(--accent)}

.pager{display:flex;justify-content:space-between;gap:12px;padding:32px 0;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-size:15px;color:var(--muted)}
.pager a:hover{color:var(--accent)}
.pager b{display:block;color:var(--text);font-size:17px}
.pager .next{text-align:right;margin-left:auto}
footer{padding:28px 0 56px;font-size:13px;color:var(--faint);border-top:1px solid var(--line)}

@media (max-width:640px){
  .bar .wrap{gap:8px}
  .brand{display:none}
  .tabs{margin-left:-6px}
  .page-head{padding:36px 0 24px}
  .page-head h1{font-size:28px}
  .hero{gap:18px}
  .hero img{width:84px;height:84px}
  .hero h1 small{display:block;margin:2px 0 0}
  .stats{grid-template-columns:1fr 1fr}
  .cats,.cards{grid-template-columns:1fr}
  .rows li{grid-template-columns:1fr;gap:2px}
}
@media print{.bar,.pager{display:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="#home">박동영</a>
  <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
</div></header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">© <span id="year"></span> 박동영 · Park, Dong-Young</div></footer>

<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const P = window.PROFILE;

  /* ---------- 블록 렌더러 ---------- */
  const entry = (e, now) => `<div class="entry${now ? " now" : ""}">
      <div class="period">${esc(e.period)}</div>
      <h3>${esc(e.org)}</h3>
      ${e.role ? `<p class="role">${esc(e.role)}</p>` : ""}
      ${e.desc ? `<p class="desc">${esc(e.desc)}</p>` : ""}
    </div>`;
  const row = (d, t, s, badge) => `<li><span class="d">${esc(d)}</span><span class="t">${badge || ""}${esc(t)}${s ? `<span class="s">${esc(s)}</span>` : ""}</span></li>`;
  const card = (t, s, d, extra) => `<div class="card"><div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}${d ? `<div class="d">${esc(d)}</div>` : ""}${extra || ""}</div>`;
  const badge = (txt, gold) => `<span class="badge${gold ? " gold" : ""}">${esc(txt)}</span>`;
  const section = (title, items, lead, body) =>
    `<section><h2>${esc(title)}<span class="count">${items.length}</span></h2>${lead ? `<p class="lead">${esc(lead)}</p>` : ""}${body}</section>`;

  const S = {
    current: () => section("현재", CURRENT, "지금 맡고 있는 역할입니다.", CURRENT.map(e => entry(e, true)).join("")),
    past: () => section("이전 경력", PAST, "", PAST.map(e => entry(e)).join("")),
    edu: () => section("학력", EDUCATION, "병역 · " + MILITARY, EDUCATION.map(e => entry(e)).join("")),
    directing: () => section("기획 · 연출 · 안무", DIRECTING, "국내외 태권도 시범공연과 공연예술 무대를 기획하고 연출했습니다.",
      `<ul class="rows">${DIRECTING.map(([d, t]) => row(d || "—", t)).join("")}</ul>`),
    media: () => section("영상물 제작", MEDIA, "기획·제작한 영상 콘텐츠와 앱입니다.",
      `<div class="cards">${MEDIA.map(([y, t, r, s]) => card(t, s, y + " · " + r)).join("")}</div>`),
    broadcast: () => section("방송 · 광고 출연", BROADCAST, "",
      `<ul class="rows">${BROADCAST.map(([d, t, s]) => row(d, t, s)).join("")}</ul>`),
    papers: () => section("논문 · 저서", PAPERS, "태권도 시범 공연과 지도자, 도장 경영에 관한 연구입니다.",
      `<ul class="rows">${PAPERS.map(p => row(p.date, p.title, p.where, badge(p.type))).join("")}</ul>`),
    grants: () => section("정부지원 사업", GRANTS, "수행한 정부·공공기관 지원 사업입니다. 금액 단위: 천원",
      `<div class="cards">${GRANTS.map(([t, s, d, a]) => card(t, s, d, `<div class="amt">${esc(a)}천원</div>`)).join("")}</div>`),
    awards: () => section("수상", AWARDS, "시범·품새·격파 대회 수상 기록입니다.",
      `<ul class="rows">${AWARDS.map(([d, r, t, s]) => row(d, t, s, badge(r, /1위|우승|금상/.test(r)))).join("")}</ul>`),
    honors: () => section("표창", HONORS, "",
      `<ul class="rows">${HONORS.map(([d, t, s]) => row(d, t, s)).join("")}</ul>`),
    licenses: () => section("자격 · 단증", LICENSES, "",
      `<div class="cards">${LICENSES.map(([t, s, d]) => card(t, s, d)).join("")}</div>`),
    judging: () => section("심사 · 위원 활동", JUDGING, "",
      `<ul class="rows">${JUDGING.map(([d, t]) => row(d, t)).join("")}</ul>`),
  };

  /* ---------- 카테고리 정의 (순서 = 메뉴 순서) ---------- */
  const CATS = [
    { id: "career", name: "경력", desc: "대학 교수, 시범단 감독, 협회 활동 등 소속과 역할",
      lead: "각 소속에서 맡은 역할과 기간을 최신순으로 정리했습니다.",
      blocks: ["current", "past", "edu"], count: () => CURRENT.length + PAST.length },
    { id: "stage", name: "공연·연출", desc: "시범공연 기획·연출, 영상 제작, 방송 출연",
      lead: "70여 개국 시범공연부터 뮤지컬·페스티벌 연출, 영상 콘텐츠까지.",
      blocks: ["directing", "media", "broadcast"], count: () => DIRECTING.length + MEDIA.length + BROADCAST.length },
    { id: "research", name: "연구", desc: "학위논문, 학술지 논문, 저서, 정부지원 사업",
      lead: "태권도 시범과 지도자 교육에 관한 연구와 지원 사업 수행 이력입니다.",
      blocks: ["papers", "grants"], count: () => PAPERS.length + GRANTS.length },
    { id: "awards", name: "수상·자격", desc: "대회 수상, 기관 표창, 자격증과 단증",
      lead: "대회 수상과 표창, 보유 자격을 정리했습니다.",
      blocks: ["awards", "honors", "licenses"], count: () => AWARDS.length + HONORS.length + LICENSES.length },
    { id: "committee", name: "심사·위원", desc: "대회 심사, 선발위원, 위원회 활동",
      lead: "대회 심사와 선발, 위원회 활동 이력입니다.",
      blocks: ["judging"], count: () => JUDGING.length },
  ];

  const contact = () => `<section class="contact"><h2>함께 이야기 나눠요</h2>
    <p class="lead" style="margin:0">공연 연출, 시범단 지도, 강연과 교육 협업 제안을 환영합니다.</p>
    <ul>${P.email ? `<li><a href="mailto:${esc(P.email)}">✉ ${esc(P.email)}</a></li>` : ""}
    <li><a href="#" onclick="window.print();return false">이 페이지 인쇄 / PDF 저장</a></li></ul></section>`;

  /* ---------- 페이지 ---------- */
  function home() {
    return `<div class="page-head">
        <div class="hero">
          <img src="assets/profile.jpg" alt="박동영 프로필 사진">
          <div><h1>${esc(P.name)}<small>${esc(P.nameEn)}</small></h1><p class="title">${esc(P.title)}</p></div>
        </div>
        <p class="intro">${esc(P.intro)}</p>
        <p class="updated">업데이트 ${esc(P.updated)}</p>
        <div class="stats">${P.highlights.map(h => `<div class="stat"><b>${esc(h.num)}</b><span>${esc(h.label)}</span></div>`).join("")}</div>
      </div>
      <section><h2>카테고리</h2><p class="lead">보고 싶은 이력을 골라 주세요.</p>
        <div class="cats">${CATS.map(c => `<a class="cat" href="#${c.id}">
          <span class="n">${c.count()}건</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><span class="go">자세히 보기 →</span></a>`).join("")}</div>
      </section>${contact()}`;
  }
  function category(c) {
    const i = CATS.indexOf(c), prev = CATS[i - 1], next = CATS[i + 1];
    return `<div class="page-head"><h1>${esc(c.name)}</h1><p>${esc(c.lead)}</p></div>
      ${c.blocks.map(b => S[b]()).join("")}
      <nav class="pager">
        ${prev ? `<a href="#${prev.id}">← 이전<b>${esc(prev.name)}</b></a>` : `<a href="#home">← 처음<b>소개</b></a>`}
        ${next ? `<a class="next" href="#${next.id}">다음 →<b>${esc(next.name)}</b></a>` : ""}
      </nav>`;
  }

  $("tabs").innerHTML = `<a href="#home" data-id="home">소개</a>` + CATS.map(c => `<a href="#${c.id}" data-id="${c.id}">${esc(c.name)}</a>`).join("");
  $("year").textContent = new Date().getFullYear();

  function route() {
    const id = location.hash.slice(1) || "home";
    const c = CATS.find(x => x.id === id);
    $("app").innerHTML = c ? category(c) : home();
    document.title = (c ? c.name + " | " : "") + "박동영 이력";
    document.querySelectorAll("#tabs a").forEach(a => {
      const on = a.dataset.id === (c ? c.id : "home");
      a.classList.toggle("active", on);
      if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
